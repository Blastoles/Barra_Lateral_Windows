name: "Build & Release - Barra Lateral Windows"

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Dependências Frontend
        run: npm ci

      - name: Compilar & Publicar Release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly-dev' }}
          releaseName: ${{ github.ref_type == 'tag' && format('{0} — Barra Lateral Windows', github.ref_name) || 'Nightly Development Build' }}
          releaseBody: ${{ github.ref_type == 'tag' && 'Consulte o CHANGELOG.md para detalhes da versão.' || 'Build de desenvolvimento automático atualizado a cada commit na branch main.' }}
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}
